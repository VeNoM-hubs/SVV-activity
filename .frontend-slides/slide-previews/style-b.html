<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Testing — Online Food Ordering System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--ink2:#1A1A18;--fire:#E85D26;--cream:#F0ECE5;--muted:#888880;--hint:#505048;--border:#282826;--stage-bg:#000;--slide-bg:var(--ink)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;visibility:hidden;opacity:0;background:var(--slide-bg)}
.slide.active{visibility:visible;opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

.slide{font-family:'Barlow',sans-serif;color:var(--cream)}
.chrome{position:absolute;left:96px;right:96px;top:64px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-bottom:22px;border-bottom:1px solid var(--border)}
.chrome b{color:var(--fire);font-weight:500}
h1{position:absolute;left:84px;top:170px;font-weight:900;font-size:250px;line-height:.86;letter-spacing:-.045em;text-transform:lowercase}
h1 span{display:block;opacity:0;transform:translateY(60px);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
h1 span:nth-child(2){animation-delay:.12s;color:var(--fire)}
h1 span:nth-child(3){animation-delay:.24s}
.side{position:absolute;right:96px;top:200px;width:520px;border-left:1px solid var(--border);padding-left:40px;opacity:0;animation:fade 1s ease forwards .6s}
.side .k{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.side p{font-size:34px;line-height:1.3;font-weight:500;margin-bottom:44px}
.foot{position:absolute;left:96px;right:96px;bottom:64px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);opacity:0;animation:fade 1s ease forwards .9s}
.foot div{padding:26px 0 0;font-size:30px;font-weight:700;text-transform:lowercase}
.foot div small{display:block;font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--hint);font-weight:400;margin-bottom:8px;letter-spacing:.1em}
.blob{position:absolute;right:-120px;bottom:-160px;width:620px;height:620px;border-radius:50%;background:var(--fire);opacity:.08;filter:blur(10px)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active">
  <div class="blob"></div>
  <div class="chrome"><span><b>■</b> Team 04 — Manual Test Report</span><span>Online Food Ordering System</span></div>
  <h1><span>order.</span><span>test.</span><span>break.</span></h1>
  <div class="side">
    <div class="k">Application under test</div>
    <p>Online Food Ordering System</p>
    <div class="k">Scope</div>
    <p>Black-box &amp; white-box design, coverage, and all four levels of testing.</p>
  </div>
  <div class="foot">
    <div><small>01</small>bhaskar lukram</div>
    <div><small>02</small>khushi raghav</div>
    <div><small>03</small>kartik gupta</div>
    <div><small>04</small>ayush pandey</div>
  </div>
</section>
</main></div>
<script>
const s=document.getElementById('deckStage');function fit(){const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`}fit();addEventListener('resize',fit);
</script>
</body>
</html>
